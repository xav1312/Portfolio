<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Portfolio — Xavier Petilaire-Bellet</title>
    <script>
      // SPA pour GitHub Pages — Redirige les 404 vers index.html en conservant le chemin
      // Technique : https://github.com/rafgraph/spa-github-pages
      // pathSegmentsToKeep = 1 pour conserver le segment /Portfolio/
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.host +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
